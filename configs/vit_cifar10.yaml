project:
  seed: 42
  name: vit-cifar10

data:
  data_dir: ../data
  batch_size: 128
  num_workers: 4
  val_split: 5000

model:
  image_size: 32
  patch_size: 4
  in_channels: 3
  num_classes: 10
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_ratio: 4.0
  dropout: 0.1
  emb_dropout: 0.1

train:
  max_epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.05
  optimizer: adamw
  scheduler: cosine

logging:
  save_dir: ./logs
  name: vit-cifar10
  version: null
  log_every_n_steps: 20

checkpoint:
  dirpath: ./checkpoints
  monitor: val_acc
  mode: max
  save_top_k: 1

runtime:
  accelerator: auto
  devices: auto
  precision: 32-true
  deterministic: warn

